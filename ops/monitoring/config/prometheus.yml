# Glider Buddy Prometheus scrape config
# Example install: /etc/prometheus/prometheus.yml (promtool check config)
# Tune instance labels and rule_files path per host. See RUNBOOK.md and HOST_PROFILES.md.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  # 16 GiB hosts: alert_rules.yml — ~10 GiB: alert_rules_10gb.yml
  - /etc/prometheus/alert_rules.yml

# Uncomment when Alertmanager is installed (see backlog: external notifications).
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - 127.0.0.1:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - "127.0.0.1:9091"

  - job_name: node
    static_configs:
      - targets:
          - "127.0.0.1:9100"
        labels:
          instance: gliderbuddy-host

  - job_name: process
    static_configs:
      - targets:
          - "127.0.0.1:9256"
        labels:
          instance: gliderbuddy-host

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - "http://127.0.0.1:8080/healthz"
          - "http://127.0.0.1:8080/login.html"
        labels:
          probe: local
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: "127.0.0.1:9115"
